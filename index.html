<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPRO - Simulador CNC 3D</title>
    
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    
    <script src="js/main.js" defer></script>
</head>
<body>

    <div id="menu-inicial">
        <div class="caixa-menu">
            <img src="imagens/mprologo.png" alt="Logotipo MPRO" class="logo-mpro">
            
            <h1 class="titulo-boas-vindas">BEM-VINDO AO SIMULADOR 3D DE DOBRAGEM DE ARAME</h1>
            <div class="linha-separadora"></div>
            
            <p>Defina as propriedades físicas das ferramentas antes de iniciar.</p>
            
            <div class="form-group">
                <label>Diâmetro do Arame (mm)</label>
                <input type="number" id="input-diametro" value="6" min="1" max="20" step="0.1">
            </div>
            
            <div class="form-group">
                <label>Diâmetro da Curvatura / Matriz (Máx 30mm)</label>
                <input type="number" id="input-curvatura" value="30" max="30" min="10" step="0.5">
            </div>

            <button id="btn-iniciar" class="btn-verde btn-grande">Iniciar Software</button>
        </div>
    </div>

    <div id="simulador-container">
        
        <div id="ecra-3d"></div>

        <div id="sidebar">
            
            <div class="painel">
                <div class="painel-titulo">Programação Manual</div>
                
                <div class="linha-controlo">
                    <label>Avanço / Recuo (X) mm:</label>
                    <input type="number" id="input-x" value="0">
                </div>
                <div class="linha-controlo">
                    <label>Rodar Arame (Z) º:</label>
                    <input type="number" id="input-z" value="0">
                </div>
                <div class="linha-controlo">
                    <label>Dobrar Arame (D) º:</label>
                    <input type="number" id="input-d" value="0">
                </div>

                <div class="grupo-botoes-adicionar">
                    <button id="btn-adicionar" class="btn-verde flex-1">+ Adicionar</button>
                    <button id="btn-corte" class="btn-azul flex-1">✂️ Cortar</button>
                </div>
            </div>

            <div class="painel painel-flex">
                <div class="painel-titulo">G-Code / Memória</div>
                <div id="lista-comandos"></div>
                <button id="btn-limpar" class="btn-vermelho mt-10">Limpar Memória</button>
            </div>

            <div class="painel" id="painel-simulacao">
                <div class="painel-titulo">Produção CNC</div>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-play" class="btn-play" style="flex: 2;">▶ INICIAR</button>
                    <button id="btn-pause" class="btn-play" style="flex: 1; background: #607d8b; display: none;">⏸ PAUSA</button>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
